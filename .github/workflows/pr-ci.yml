name: PR Validation & Quality Gate

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-changes:
    name: Detectar Proyectos Modificados
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      movil: ${{ steps.filter.outputs.movil }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Filtro de rutas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'app_ejemplo_backend/**'
            frontend:
              - 'app_ejemplo/**'
            movil:
              - 'app_ejemplo_movil/**'

  # ==============================================================================
  # JOB 1: BACKEND (Spring Boot + Java 21)
  # ==============================================================================
  backend-ci:
    name: Backend CI (Test, SonarQube, IA)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app_ejemplo_backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para análisis completo de SonarQube

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # STEP 1: Compilación y Pruebas Unitarias
      - name: "[Step 1] Compilación y Pruebas Unitarias (Maven)"
        run: |
          echo "=== Compilando y ejecutando pruebas unitarias ==="
          mvn clean test

      # STEP 2: Análisis con SonarQube / SonarCloud (Con Bypass si no está configurado o si falla)
      - name: "[Step 2] Análisis de Código con SonarQube"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        continue-on-error: true # Permite bypass si la validación estricta falla
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning title=SonarQube::SONAR_TOKEN no está configurado en GitHub Secrets. Se omite el análisis estático sin fallar el build."
            exit 0
          fi
          echo "=== Ejecutando escaneo con SonarQube ==="
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # STEP 3: Agente de IA para Code Review
      - name: "[Step 3] Agente de IA para Validación de Cambios"
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::notice title=Agente IA::AI_API_KEY no configurado en Secrets. Se omite la revisión inteligente del PR."
            exit 0
          fi
          echo "=== Ejecutando Agente de IA para análisis del Backend ==="
          # Si el API Key existe, aquí se invoca el agente o script de IA
          echo "Agente de IA analizando cambios en el PR #$PR_NUMBER..."

  # ==============================================================================
  # JOB 2: FRONTEND (Next.js 14)
  # ==============================================================================
  frontend-ci:
    name: Frontend CI (Lint, Build, Sonar, IA)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app_ejemplo

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app_ejemplo/package-lock.json

      # STEP 1: Instalación, Linter y Build de Next.js
      - name: "[Step 1] Instalar Dependencias, Linter y Compilación"
        run: |
          echo "=== Instalando dependencias ==="
          npm ci
          echo "=== Ejecutando linter ==="
          npm run lint --if-present
          echo "=== Compilando Next.js ==="
          npm run build

      # STEP 2: SonarQube Frontend
      - name: "[Step 2] Análisis de Código con SonarQube (Frontend)"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        continue-on-error: true
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning title=SonarQube::SONAR_TOKEN no configurado. Omitiendo escaneo de Frontend."
            exit 0
          fi
          echo "=== Escaneando Frontend con SonarQube ==="

      # STEP 3: Agente de IA para Code Review
      - name: "[Step 3] Agente de IA para Validación de Cambios (Frontend)"
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        continue-on-error: true
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::notice title=Agente IA::AI_API_KEY no configurado. Omitiendo revisión de IA para Frontend."
            exit 0
          fi
          echo "=== Agente de IA analizando cambios en Frontend ==="

  # ==============================================================================
  # JOB 3: MOVIL (React Native / Expo SDK 51)
  # ==============================================================================
  movil-ci:
    name: Móvil CI (Typecheck & Validación)
    needs: detect-changes
    if: needs.detect-changes.outputs.movil == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app_ejemplo_movil

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app_ejemplo_movil/package-lock.json

      - name: "[Step 1] Instalar y Validar Tipos (TypeScript)"
        run: |
          npm ci
          npx tsc --noEmit
